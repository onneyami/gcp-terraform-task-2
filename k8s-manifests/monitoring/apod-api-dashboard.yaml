              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{pod=~\"apod-api.*\"}[1h])) by (pod)",
