apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apod-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onneyami/gcp-terraform-task-2
    targetRevision: main
    path: k8s-manifests/apod
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true