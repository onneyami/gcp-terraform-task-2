# Internal Service for WireGuard Web UI
apiVersion: v1
kind: Service
metadata:
  name: wireguard-ui-service
  namespace: default
  labels:
    app: wireguard-ui
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: wireguard-ui