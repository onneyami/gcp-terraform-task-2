apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard-ui
  namespace: default
  labels:
    app: wireguard-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard-ui
  template:
    metadata:
      labels:
        app: wireguard-ui
    spec:
      volumes:
        - name: wireguard-config
          emptyDir: {}
      # Init container sets IP forwarding without triggering GKE SysctlForbidden
      initContainers:
        - name: enable-sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w net.ipv4.ip_forward=1"]
          securityContext:
            privileged: true
      containers:
        # 1. WireGuard Server Container
        - name: wireguard-server
          image: linuxserver/wireguard:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: "0"
            - name: PEERDNS
              value: "1.1.1.1"
            - name: WG_I_PREFER_BUGGY_USERSPACE_TO_NO_WIREGUARD
              value: "true"
            - name: POSTUP
              value: "iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE"
            - name: POSTDOWN
              value: "iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE"
          ports:
            - containerPort: 51820
              name: wireguard-udp
              protocol: UDP
          volumeMounts:
            - name: wireguard-config
              mountPath: /etc/wireguard

        # 2. WireGuard Web UI Container
        - name: wireguard-ui
          image: ngoduykhanh/wireguard-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: BIND_ADDRESS
              value: "0.0.0.0:5000"
            - name: WGUI_USERNAME
              value: "admin"
            - name: WGUI_PASSWORD
              value: "AdminPassword123!"
            - name: WGUI_MANAGE_START
              value: "false"
            - name: WGUI_MANAGE_RESTART
              value: "false"
          volumeMounts:
            - name: wireguard-config
              mountPath: /etc/wireguard