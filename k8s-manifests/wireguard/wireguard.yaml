apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard-ui
  namespace: default
  labels:
    app: wireguard-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard-ui
  template:
    metadata:
      labels:
        app: wireguard-ui
    spec:
      volumes:
        - name: wireguard-config
          emptyDir: {}
      containers:
        # 1. WireGuard Server Container
        - name: wireguard-server
          image: linuxserver/wireguard:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: "0"
            - name: PEERDNS
              value: "1.1.1.1"
            - name: WG_I_PREFER_BUGGY_USERSPACE_TO_NO_WIREGUARD
              value: "true"
            - name: POSTUP
              value: "iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE"
            - name: POSTDOWN
              value: "iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE"
          ports:
            - containerPort: 51820
              name: wireguard-udp
              protocol: UDP
          volumeMounts:
            - name: wireguard-config
              mountPath: /etc/wireguard

        # 2. WireGuard Web UI Container
        - name: wireguard-ui
          image: ngoduykhanh/wireguard-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: BIND_ADDRESS
              value: "0.0.0.0:5000"
            - name: WGUI_USERNAME
              value: "admin"
            - name: WGUI_PASSWORD
              value: "AdminPassword123!"
            - name: WGUI_MANAGE_START
              value: "false"
            - name: WGUI_MANAGE_RESTART
              value: "false"
          volumeMounts:
            - name: wireguard-config
              mountPath: /etc/wireguard

---
# Internal Service for WireGuard Web UI
apiVersion: v1
kind: Service
metadata:
  name: wireguard-ui-service
  namespace: default
  labels:
    app: wireguard-ui
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: wireguard-ui

---
# LoadBalancer Service for UDP VPN Traffic
apiVersion: v1
kind: Service
metadata:
  name: wireguard-udp-service
  namespace: default
  labels:
    app: wireguard-ui
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  loadBalancerSourceRanges:
    - "0.0.0.0/0"
  ports:
    - port: 51820
      targetPort: 51820
      protocol: UDP
      name: wireguard-udp
  selector:
    app: wireguard-ui

---
# Ingress for Web UI Access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wireguard-ui-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - vpn.andrei-test.lendo.dev
      secretName: wireguard-ui-tls
  rules:
    - host: vpn.andrei-test.lendo.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wireguard-ui-service
                port:
                  number: 5000