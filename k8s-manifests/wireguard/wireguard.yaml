apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard-ui
  namespace: default
  labels:
    app: wireguard-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard-ui
  template:
    metadata:
      labels:
        app: wireguard-ui
    spec:
      containers:
        - name: wireguard-ui
          image: ngoduykhanh/wireguard-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: BIND_ADDRESS
              value: "0.0.0.0:5000"
            - name: WGUI_USERNAME
              value: "admin"
            - name: WGUI_PASSWORD
              value: "AdminPassword123!"
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard-ui-service
  namespace: default
  labels:
    app: wireguard-ui
spec:
  type: ClusterIP
  ports:
    - port: 51821
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: wireguard-ui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wireguard-ui-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - vpn.andrei-test.lendo.dev
      secretName: wireguard-ui-tls
  rules:
    - host: vpn.andrei-test.lendo.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wireguard-ui-service
                port:
                  number: 51821