# Ingress for Web UI Access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wireguard-ui-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - vpn.andrei-test.lendo.dev
      secretName: wireguard-ui-tls
  rules:
    - host: vpn.andrei-test.lendo.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wireguard-ui-service
                port:
                  number: 5000