apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-podinfo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/stefanprodan/podinfo.git'
    targetRevision: HEAD
    path: 'kustomize'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: demo-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true