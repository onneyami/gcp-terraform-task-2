apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins-sa
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      initContainers:
        - name: install-plugins
          image: jenkins/jenkins:lts-jdk21
          command:
            - sh
            - -c
            - |
              jenkins-plugin-cli -d /var/jenkins_home/plugins --plugins \
                git:latest \
                github:latest \
                workflow-aggregator:latest \
                configuration-as-code:latest \
                google-kubernetes-engine:latest \
                kubernetes:latest \
                job-dsl:latest \
                credentials:latest \
                plain-credentials:latest \
                theme-manager:latest \
                dark-theme:latest 
          volumeMounts:
            - name: jenkins-home-volume
              mountPath: /var/jenkins_home
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk21
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false"
            - name: CASC_JENKINS_CONFIG
              value: /var/jenkins_home/casc_configs/jenkins.yaml
          envFrom:
            - secretRef:
                name: jenkins-pipeline-secrets
          ports:
            - containerPort: 8080
              name: web
            - containerPort: 50000
              name: agent
          volumeMounts:
            - name: jenkins-home-volume
              mountPath: /var/jenkins_home
            - name: casc-config
              mountPath: /var/jenkins_home/casc_configs
      volumes:
        - name: jenkins-home-volume
          persistentVolumeClaim:
            claimName: jenkins-home-pvc
        - name: casc-config
          configMap:
            name: jenkins-casc-config