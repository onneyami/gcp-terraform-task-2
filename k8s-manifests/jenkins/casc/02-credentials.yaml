credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "argocd-jenkins-token"
              secret: "${ARGOCD_TOKEN}"
              description: "ArgoCD API Token for Jenkins Pipeline"
          - usernamePassword:
              scope: GLOBAL
              id: "github-jenkins-token"
              username: "${GITHUB_USERNAME:-onneyami}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub Personal Access Token"