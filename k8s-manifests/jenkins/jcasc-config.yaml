apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc-config
  namespace: jenkins
data:
  01-core.yaml: |
    jenkins:
      slaveAgentPort: 50000
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "${JENKINS_ADMIN_USER}"
              password: "${JENKINS_ADMIN_PASSWORD}"
      authorizationStrategy:
        loggedInUsersCanDoAnything:
          allowAnonymousRead: false
      clouds:
        - kubernetes:
            name: "kubernetes"
            namespace: "${JENKINS_NAMESPACE}"
            serverUrl: "https://kubernetes.default.svc"
            jenkinsUrl: "${JENKINS_INTERNAL_URL}"
            templates:
              - name: "gcp-agent"
                label: "gcp-agent"
                serviceAccount: "${JENKINS_SERVICE_ACCOUNT}"
                containers:
                  - name: "jnlp"
                    image: "jenkins/inbound-agent:latest"
                    workingDir: "/home/jenkins/agent"
                  - name: "build-tools"
                    image: "gcr.io/google.com/cloudsdktool/google-cloud-cli:slim"
                    command: "cat"
                    ttyEnabled: true

    unclassified:
      location:
        url: "${JENKINS_EXTERNAL_URL}"

    appearance:
      themeManager:
        disableUserThemes: false
        theme: "dark"

  02-credentials.yaml: |
    credentials:
      system:
        domainCredentials:
          - credentials:
              - string:
                  scope: GLOBAL
                  id: "argocd-jenkins-token"
                  secret: "${ARGOCD_TOKEN}"
                  description: "ArgoCD API Token for Jenkins Pipeline"
              - usernamePassword:
                  scope: GLOBAL
                  id: "github-jenkins-token"
                  username: "${GITHUB_USERNAME}"
                  password: "${GITHUB_TOKEN}"
                  description: "GitHub Personal Access Token"

  03-jobs.yaml: |
    jobs:
      - script: |
          pipelineJob('gcp-app-ci-cd') {
            definition {
              cpsScm {
                scm {
                  git {
                    remote {
                      url('${GIT_REPO_URL}')
                    }
                    branches('*/main')
                  }
                }
                scriptPath('Jenkinsfile')
              }
            }
          }