apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc-config
  namespace: jenkins
data:
  jenkins.yaml: |
    jenkins:
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "admin"
              password: "AdminPassword123!" # Replace with desired admin password or load from K8s Secret
      authorizationStrategy:
        loggedInUsersCanDoAnything:
          authenticatedUserReadPermission: true
      mode: NORMAL
      numExecutors: 2
      scmCheckoutRetryCount: 2
    unclassified:
      location:
        url: "https://jenkins.andrei-test.lendo.dev/"