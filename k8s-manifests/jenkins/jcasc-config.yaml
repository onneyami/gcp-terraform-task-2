apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc-config
  namespace: jenkins
data:
  jenkins.yaml: |
    jenkins:
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "admin"
              password: "AdminPassword123!"
      authorizationStrategy:
        loggedInUsersCanDoAnything:
          allowAnonymousRead: false
    unclassified:
      location:
        url: "https://jenkins.andrei-test.lendo.dev/"
    jobs:
      - script: |
          pipelineJob('gcp-app-ci-cd') {
            definition {
              cpsScm {
                scm {
                  git {
                    remote {
                      url('https://github.com/onneyami/gcp-terraform-task-2.git')
                    }
                    branches('*/main')
                  }
                }
                scriptPath('Jenkinsfile')
              }
            }
          }